# 本文件的作用是：配置当前工具、服务或构建流程所需的参数。
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "class-confusion-radar-backend"
version = "0.1.0"
description = "Backend for Class Confusion Radar"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "greenlet>=3.1,<3.2; python_version<'3.10'",
  "httpx>=0.27.2",
  "openpyxl>=3.1.5",
  "pydantic-settings>=2.5.2",
  "psycopg[binary]>=3.2.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.34",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
